[workspace]
resolver = "2"
members = ["protocol", "host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/usbra/usbra"

[profile.release]
opt-level = 3
lto = "thin"
debug = true           # keep symbols for perf/flamegraph in M8
